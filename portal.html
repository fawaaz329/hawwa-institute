<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Portal | Hawwā Institute</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  body { background: #f8fafc; font-family: "DM Sans", sans-serif; }
  .serif { font-family: "Cormorant Garamond", serif; }
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center">

<div id="toastNotification" style="position:fixed;right:20px;bottom:20px;z-index:400;background:#1e1e1e;color:#fff;padding:14px 22px;border-left:4px solid #008f5d;border-radius:6px;transform:translateY(120px);opacity:0;transition:.3s;box-shadow:0 10px 30px rgba(0,0,0,0.3)">
  <span id="toastMessage">Update confirmed.</span>
</div>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="w-full max-w-sm p-8 bg-white rounded-2xl shadow-xl border-2 border-[#5b0a63] text-center mx-4">
  <img src="logo.png" alt="Logo" class="h-16 mx-auto mb-4 border border-slate-200 rounded p-1" onerror="this.src='https://via.placeholder.com/80x80?text=Hawwa'">
  <h1 class="serif text-3xl font-bold text-[#5b0a63] mb-1">Student Portal</h1>
  <p class="text-xs text-slate-500 mb-6">Log in to view your records and invoices.</p>
  
  <input type="text" id="stuId" placeholder="Student ID (e.g. HAW-260001)" class="w-full p-3 border rounded-xl text-sm bg-slate-50 mb-3 outline-none focus:border-[#008f5d]">
  <input type="password" id="stuPass" placeholder="Password" class="w-full p-3 border rounded-xl text-sm bg-slate-50 mb-4 outline-none focus:border-[#008f5d]" onkeydown="if(event.key==='Enter') studentLogin()">
  
  <button onclick="studentLogin()" id="loginBtn" class="w-full py-3 bg-[#008f5d] hover:bg-[#006642] text-white rounded-xl text-sm font-bold transition shadow-md">
    Access Portal →
  </button>
  <p id="errTxt" class="text-xs text-rose-600 mt-3 hidden font-bold"></p>
  <div class="mt-6 pt-4 border-t"><a href="index.html" class="text-xs text-slate-400 hover:text-slate-600">← Back to Main Website</a></div>
</div>

<!-- DASHBOARD SCREEN -->
<div id="dashScreen" class="hidden w-full max-w-4xl p-4 sm:p-8 flex-col">
  
  <div class="flex justify-between items-center bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 mb-6">
    <div class="flex items-center gap-4">
      <div class="w-12 h-12 bg-[#fbf0fd] rounded-full flex items-center justify-center text-[#5b0a63] text-xl font-bold"><i class="fa-solid fa-user"></i></div>
      <div>
        <h2 class="serif text-2xl font-bold text-[#1e1e1e]" id="dashName">Welcome</h2>
        <span class="text-xs font-mono font-bold text-[#008f5d]" id="dashId">HAW-</span>
      </div>
    </div>
    <button onclick="studentLogout()" class="px-4 py-2 bg-rose-50 text-rose-700 rounded-xl text-xs font-bold hover:bg-rose-100 transition"><i class="fa-solid fa-power-off"></i> Logout</button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="md:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit">
      <h3 class="font-bold text-sm text-[#5b0a63] border-b pb-2 mb-4">My Registration</h3>
      <div class="space-y-3 text-xs text-slate-700">
        <div class="flex justify-between"><span class="text-slate-500">Status:</span> <strong id="dashStatus" class="text-[#008f5d]"></strong></div>
        <div class="flex flex-col mt-2"><span class="text-slate-500 mb-1">Enrolled Programme(s):</span> <strong id="dashCourses" class="bg-slate-50 p-2 border rounded"></strong></div>
        <div class="flex justify-between mt-2"><span class="text-slate-500">Payment Plan:</span> <strong id="dashPaymentPlan"></strong></div>
        <div class="flex justify-between"><span class="text-slate-500">Payment Method:</span> <strong id="dashPaymentMethod"></strong></div>
        <div class="flex justify-between"><span class="text-slate-500">Total Contribution:</span> <strong id="dashTotalFee"></strong></div>
      </div>
    </div>

    <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h3 class="font-bold text-sm text-[#5b0a63] border-b pb-2 mb-4">My Official Invoices & Receipts</h3>
      <div id="invoiceList" class="space-y-3">
        <div class="text-center py-8 text-xs text-slate-400"><i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i><br>Loading records...</div>
      </div>
    </div>
  </div>
</div>

<script>
function showToast(msg) {
  const t = document.getElementById("toastNotification");
  document.getElementById("toastMessage").innerText = msg;
  t.style.transform = "none"; t.style.opacity = "1";
  setTimeout(() => { t.style.transform = "translateY(120px)"; t.style.opacity = "0"; }, 3000);
}

async function studentLogin() {
  const btn = document.getElementById("loginBtn");
  const err = document.getElementById("errTxt");
  const stuId = document.getElementById("stuId").value.trim().toUpperCase();
  const stuPass = document.getElementById("stuPass").value.trim();

  if(!stuId || !stuPass) { err.innerText = "Please enter your Student ID and Password."; err.classList.remove("hidden"); return; }
  btn.disabled = true; btn.innerText = "Verifying..."; err.classList.add("hidden");

  try {
    const res = await fetch("/api/data", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "studentLogin", data: { studentNumber: stuId, password: stuPass }})
    });
    const json = await res.json();
    if(res.ok && json.success) {
      localStorage.setItem("hawwa_student_token", json.token);
      loadStudentDash();
      showToast("Login Successful");
    } else throw new Error(json.error || "Login Failed");
  } catch(e) { err.innerText = e.message; err.classList.remove("hidden"); } 
  finally { btn.disabled = false; btn.innerText = "Access Portal →"; }
}

async function loadStudentDash() {
  const token = localStorage.getItem("hawwa_student_token");
  if(!token) return;

  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("dashScreen").classList.remove("hidden");
  document.getElementById("dashScreen").classList.add("flex");

  try {
    const res = await fetch("/api/data", { headers: { "X-Student-Token": token, "Cache-Control": "no-cache" } });
    if(!res.ok) throw new Error();
    const data = await res.json();

    document.getElementById("dashName").innerText = `${data.student.fname} ${data.student.sname}`;
    document.getElementById("dashId").innerText = data.student.studentNumber;
    document.getElementById("dashStatus").innerText = data.student.status;
    document.getElementById("dashPaymentMethod").innerText = data.student.paymentMethod;
    document.getElementById("dashPaymentPlan").innerText = data.student.paymentPlan || "Not Selected";
    document.getElementById("dashTotalFee").innerText = data.student.totalFee || "R 0";
    document.getElementById("dashCourses").innerText = Array.isArray(data.student.courses) ? data.student.courses.join(", ") : (data.student.courses || "-");

    const invBox = document.getElementById("invoiceList");
    invBox.innerHTML = (!data.invoices || data.invoices.length === 0) ? `<p class="text-xs text-slate-400 text-center py-6">No invoices or receipts available yet.</p>` : "";
    
    (data.invoices || []).forEach(inv => {
      invBox.innerHTML += `
        <div class="flex justify-between items-center p-4 bg-[#fbf0fd] border border-[#5b0a6320] rounded-xl text-xs">
          <div><strong class="text-[#5b0a63] block text-sm mb-1">${inv.type}</strong><span class="text-slate-500 font-mono">${inv.date}</span></div>
          <div class="text-right">
            <strong class="text-[#008f5d] block text-sm mb-1">${inv.amount}</strong>
            <a href="/api/data?fileKey=${encodeURIComponent(inv.fileKey)}" target="_blank" class="px-3 py-1.5 bg-[#5b0a63] hover:bg-[#420448] text-white rounded-lg text-[10px] font-bold shadow transition inline-block">
              <i class="fa-solid fa-download mr-1"></i> Download
            </a>
          </div>
        </div>`;
    });
  } catch(e) { studentLogout(); }
}

async function studentLogout() {
  const token = localStorage.getItem("hawwa_student_token");
  if(token) { try { await fetch("/api/data", { method: "POST", headers: { "Content-Type": "application/json", "X-Student-Token": token }, body: JSON.stringify({ action: "studentLogout" }) }); } catch(e) {} }
  localStorage.removeItem("hawwa_student_token"); window.location.reload();
}

if(localStorage.getItem("hawwa_student_token")) loadStudentDash();
</script>
</body>
</html>
