<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Hawwā Institute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100">
        <h2 class="text-2xl font-serif font-bold text-gray-900 mb-6">Online Registration</h2>
        <div id="msg" class="hidden text-green-700 bg-green-50 p-4 mb-4 rounded">Successfully registered!</div>
        <form id="regForm" class="space-y-4">
            <input type="text" id="name" placeholder="Full Name" required class="w-full border p-2 rounded">
            <input type="email" id="email" placeholder="Email" required class="w-full border p-2 rounded">
            <input type="tel" id="phone" placeholder="Phone Number" required class="w-full border p-2 rounded">
            <select id="course" required class="w-full border p-2 rounded bg-white">
                <option value="Foundation">Foundation Islamic Studies</option>
                <option value="Advanced">Advanced Fiqh & Usul</option>
            </select>
            <button type="submit" class="w-full bg-[#115e59] text-white p-3 rounded font-bold">Submit</button>
        </form>
    </div>
    <script>
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = { 
                name: document.getElementById('name').value, 
                email: document.getElementById('email').value, 
                phone: document.getElementById('phone').value,
                course: document.getElementById('course').value,
                date: new Date().toISOString()
            };
            const res = await fetch('/api/register', { method: 'POST', body: JSON.stringify(data) });
            if(res.ok) { document.getElementById('regForm').style.display='none'; document.getElementById('msg').classList.remove('hidden'); }
        });
    </script>
</body>
</html>
